<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional CV Builder - ATS Ready</title>
    <!-- Tailwind CSS untuk UI Editor -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Merriweather:wght@300;400;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        /* --- CORE PREVIEW STYLES --- */
        :root {
            --primary-color: #0E2954;
            --text-color: #333;
        }

        /* Container Kertas A4 */
        #cv-preview {
            width: 210mm;
            min-height: 297mm;
            background: white;
            margin: 0 auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        /* --- PRINT SETTINGS (CRITICAL) --- */
        @media print {
            body * { visibility: hidden; }
            #editor-panel { display: none; }
            #cv-preview-container, #cv-preview, #cv-preview * { 
                visibility: visible; 
            }
            #cv-preview-container {
                position: absolute;
                left: 0;
                top: 0;
                margin: 0;
                width: 100%;
                height: 100%;
                background: white;
            }
            #cv-preview {
                box-shadow: none;
                margin: 0;
                width: 100%;
                min-height: 100%;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
            @page { margin: 0; size: A4; }
        }

        /* =========================================
           THEME 1: ATS CLASSIC (GLOBAL STANDARD)
           - Times New Roman
           - Single Column
           - No Photo
           - High Readability
        ========================================= */
        .theme-ats-classic {
            font-family: 'Times New Roman', Times, serif;
            color: #000;
            padding: 40px 50px;
            line-height: 1.4;
        }
        .theme-ats-classic .header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 15px; margin-bottom: 20px; }
        .theme-ats-classic h1 { text-transform: uppercase; font-size: 24pt; margin: 0 0 5px 0; letter-spacing: 1px; }
        .theme-ats-classic .role { font-size: 14pt; margin-bottom: 5px; }
        .theme-ats-classic .contact-line { font-size: 10pt; margin-bottom: 5px; }
        
        .theme-ats-classic .section-title {
            text-transform: uppercase;
            font-weight: bold;
            font-size: 12pt;
            border-bottom: 1px solid #000;
            margin-top: 15px;
            margin-bottom: 10px;
            padding-bottom: 2px;
        }
        
        .theme-ats-classic .item-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 2px; font-size: 11pt; }
        .theme-ats-classic .item-sub { font-style: italic; margin-bottom: 2px; font-size: 11pt; }
        .theme-ats-classic ul { margin: 2px 0 10px 18px; padding: 0; }
        .theme-ats-classic li { font-size: 11pt; margin-bottom: 2px; }
        .theme-ats-classic .photo-box { display: none; } /* No photo in ATS Classic */
        .theme-ats-classic .sidebar { display: none; }
        .theme-ats-classic .main-col { width: 100%; }

        /* =========================================
           THEME 2: EUROPEAN MODERN (EUROPASS STYLE)
           - 2 Columns
           - Photo allowed
           - Sans Serif (Arial/Roboto)
           - Sidebar for info
        ========================================= */
        .theme-europe {
            font-family: 'Roboto', Arial, sans-serif;
            display: flex;
            color: #333;
        }
        .theme-europe .sidebar {
            width: 32%;
            background-color: var(--primary-color);
            color: white;
            padding: 30px 20px;
            font-size: 0.9rem;
        }
        .theme-europe .main-col {
            width: 68%;
            padding: 40px 30px;
            background: white;
        }
        
        /* Sidebar Elements */
        .theme-europe .photo-box {
            width: 120px;
            height: 120px;
            border-radius: 50%; /* Bulat untuk modern, Kotak untuk strict europass */
            overflow: hidden;
            margin: 0 auto 20px;
            border: 3px solid white;
            background: #ddd;
        }
        .theme-europe .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .theme-europe .sidebar-section { margin-bottom: 25px; }
        .theme-europe .sidebar-title {
            text-transform: uppercase;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.4);
            margin-bottom: 10px;
            padding-bottom: 5px;
            font-size: 1rem;
            letter-spacing: 1px;
        }
        .theme-europe .sidebar-item { margin-bottom: 8px; font-size: 0.85rem; display: flex; gap: 8px; }
        
        /* Main Elements */
        .theme-europe h1 { color: var(--primary-color); text-transform: uppercase; margin: 0; font-size: 2.2rem; line-height: 1.2; }
        .theme-europe .role { font-size: 1.1rem; color: #666; margin-bottom: 20px; font-weight: 500; }
        
        .theme-europe .section-title {
            color: var(--primary-color);
            text-transform: uppercase;
            font-weight: bold;
            border-bottom: 2px solid #eee;
            margin-top: 25px;
            margin-bottom: 15px;
            padding-bottom: 5px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .theme-europe .item-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
        .theme-europe .item-title { font-weight: bold; font-size: 1rem; }
        .theme-europe .item-date { font-size: 0.85rem; color: var(--primary-color); font-weight: bold; }
        .theme-europe .item-sub { font-size: 0.9rem; font-style: italic; color: #555; margin-bottom: 5px; }
        .theme-europe li { margin-bottom: 3px; font-size: 0.9rem; }

        /* =========================================
           THEME 3: CREATIVE MINIMAL
        ========================================= */
        .theme-creative {
            font-family: 'Inter', sans-serif;
            color: #2d3748;
            padding: 0;
            display: flex;
            flex-direction: column;
        }
        .theme-creative .header-banner {
            background: #f7fafc;
            padding: 40px 50px;
            display: flex;
            align-items: center;
            border-bottom: 4px solid var(--primary-color);
        }
        .theme-creative .header-text { flex: 1; }
        .theme-creative .photo-box {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            overflow: hidden;
            margin-left: 20px;
            background: #ddd;
        }
        .theme-creative .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        .theme-creative .body-content { padding: 30px 50px; display: flex; gap: 40px; }
        .theme-creative .left-col { width: 65%; }
        .theme-creative .right-col { width: 35%; border-left: 1px solid #e2e8f0; padding-left: 30px; }
        
        .theme-creative h1 { margin: 0; font-size: 2.5rem; letter-spacing: -1px; color: var(--primary-color); }
        .theme-creative .section-title {
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            color: #a0aec0;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        .theme-creative .item-title { font-weight: 700; font-size: 1.1rem; }
        
        /* Utility Classes for JS */
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col md:flex-row text-sm overflow-hidden">

    <!-- EDITOR PANEL (LEFT) -->
    <aside id="editor-panel" class="w-full md:w-1/3 bg-white border-r border-gray-200 h-screen overflow-y-auto flex flex-col shadow-xl z-10">
        <!-- Toolbar Atas -->
        <div class="p-4 border-b border-gray-200 sticky top-0 bg-white z-20">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <i data-lucide="file-text" class="w-5 h-5 text-blue-600"></i> CV Builder
                </h2>
                <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded flex items-center gap-2 text-xs font-bold transition">
                    <i data-lucide="printer" class="w-4 h-4"></i> Save PDF
                </button>
            </div>

            <!-- Theme Selector -->
            <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
                <label class="text-xs font-bold text-gray-500 uppercase block mb-2">Pilih Standar Format</label>
                <select id="themeSelector" onchange="updatePreview()" class="w-full p-2 border rounded text-sm bg-white mb-2">
                    <option value="ats-classic">ATS Classic (Global Standard)</option>
                    <option value="europe">European Standard (Europass Style)</option>
                    <option value="creative">Creative Minimal</option>
                </select>
                
                <div class="flex items-center gap-2 mt-2">
                     <label class="text-xs text-gray-500 uppercase flex-1">Warna Aksen:</label>
                     <input type="color" id="colorPicker" value="#0E2954" onchange="updateColor(this.value)" class="h-6 w-10 cursor-pointer rounded border">
                </div>
            </div>
        </div>

        <!-- Form Fields -->
        <div class="p-5 space-y-6 pb-20">
            
            <!-- 1. Personal Info -->
            <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                <h3 class="font-bold text-gray-700 mb-3 flex items-center gap-2 text-sm uppercase">
                    <i data-lucide="user" class="w-4 h-4"></i> Informasi Pribadi
                </h3>
                <div class="space-y-3">
                    <div class="flex items-center gap-3 mb-2">
                        <div class="w-16 h-16 bg-gray-200 rounded-full overflow-hidden flex-shrink-0 relative border border-gray-300">
                            <img id="thumb-photo" class="w-full h-full object-cover hidden">
                            <i data-lucide="image" class="w-6 h-6 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-gray-400" id="icon-photo"></i>
                        </div>
                        <input type="file" id="photoInput" onchange="handlePhoto(this)" class="text-xs w-full">
                    </div>

                    <input type="text" id="input-name" placeholder="Nama Lengkap" class="w-full p-2 border rounded" oninput="updateData('name', this.value)">
                    <input type="text" id="input-role" placeholder="Gelar / Posisi yang Dilamar" class="w-full p-2 border rounded" oninput="updateData('role', this.value)">
                    <textarea id="input-summary" rows="3" placeholder="Ringkasan Profesional (Summary)" class="w-full p-2 border rounded" oninput="updateData('summary', this.value)"></textarea>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="input-email" placeholder="Email" class="w-full p-2 border rounded" oninput="updateData('email', this.value)">
                        <input type="text" id="input-phone" placeholder="No. Telepon" class="w-full p-2 border rounded" oninput="updateData('phone', this.value)">
                    </div>
                    <input type="text" id="input-address" placeholder="Alamat / Lokasi" class="w-full p-2 border rounded" oninput="updateData('address', this.value)">
                    <input type="text" id="input-linkedin" placeholder="Link LinkedIn / Portfolio" class="w-full p-2 border rounded" oninput="updateData('linkedin', this.value)">
                </div>
            </div>

            <!-- 2. Work Experience -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-gray-700 text-sm uppercase flex items-center gap-2">
                        <i data-lucide="briefcase" class="w-4 h-4"></i> Pengalaman Kerja
                    </h3>
                    <button onclick="addItem('experience')" class="text-blue-600 hover:text-blue-800 text-xs font-bold flex items-center">+ Tambah</button>
                </div>
                <div id="editor-experience" class="space-y-3"></div>
            </div>

            <!-- 3. Education -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-gray-700 text-sm uppercase flex items-center gap-2">
                        <i data-lucide="graduation-cap" class="w-4 h-4"></i> Pendidikan
                    </h3>
                    <button onclick="addItem('education')" class="text-blue-600 hover:text-blue-800 text-xs font-bold flex items-center">+ Tambah</button>
                </div>
                <div id="editor-education" class="space-y-3"></div>
            </div>

            <!-- 4. Skills & Tools -->
            <div class="grid grid-cols-1 gap-4">
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="font-bold text-gray-700 text-sm uppercase flex items-center gap-2">
                            <i data-lucide="wrench" class="w-4 h-4"></i> Skills
                        </h3>
                        <button onclick="addItem('skills')" class="text-blue-600 hover:text-blue-800 text-xs font-bold flex items-center">+ Tambah</button>
                    </div>
                    <div id="editor-skills" class="space-y-2"></div>
                </div>
                
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="font-bold text-gray-700 text-sm uppercase flex items-center gap-2">
                            <i data-lucide="globe" class="w-4 h-4"></i> Bahasa
                        </h3>
                        <button onclick="addItem('languages')" class="text-blue-600 hover:text-blue-800 text-xs font-bold flex items-center">+ Tambah</button>
                    </div>
                    <div id="editor-languages" class="space-y-2"></div>
                </div>
            </div>

            <!-- 5. Custom Sections -->
            <div class="pt-4 border-t">
                <button onclick="addCustomSection()" class="w-full py-2 border-2 border-dashed border-gray-300 text-gray-500 rounded hover:bg-gray-50 font-bold text-xs flex justify-center items-center gap-2">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> Tambah Bagian Baru (Project/Sertifikasi)
                </button>
                <div id="editor-custom" class="space-y-4 mt-4"></div>
            </div>

        </div>
    </aside>

    <!-- PREVIEW PANEL (RIGHT) -->
    <main id="cv-preview-container" class="flex-1 bg-gray-500 p-8 overflow-auto flex justify-center items-start">
        <div id="cv-preview" class="theme-ats-classic">
            <!-- Content will be injected by JS -->
        </div>
    </main>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- INITIAL STATE ---
        const initialState = {
            theme: 'ats-classic',
            color: '#0E2954',
            photo: null,
            name: "RAHAYU",
            role: "MBA (International) Candidate",
            summary: "MBA (International) candidate with strengths in sales, marketing support, administration, and business operations. Experienced in customer communication, social media management, advertising content design, and team-based work in structured environments. Fast learner with strong work discipline.",
            email: "rahayuazhr18@gmail.com",
            phone: "+886 960-971-042",
            address: "Douliu, Yunlin, Taiwan",
            linkedin: "linkedin.com/in/rahayu",
            experience: [
                { id: 1, title: "Operations Support", company: "Company A - Taiwan", date: "2023 – Present", desc: "Coordinated with team members to ensure smooth daily operations.\nMaintained clean and organized workstation aligned with safety practices." },
                { id: 2, title: "Digital Marketing", company: "Company B - Taiwan", date: "2023 – 2024", desc: "Supported live streaming sessions and assisted real-time customer interaction.\nResponded to customer questions to support sales conversion." }
            ],
            education: [
                { id: 1, degree: "MBA (International)", school: "National Yunlin University of Science and Technology", date: "2023 – 2026" },
                { id: 2, degree: "Bachelor of Business Admin", school: "Politeknik Negeri Bengkalis", date: "2018 – 2022" }
            ],
            skills: [
                "Sales & Customer Support", 
                "Marketing Support", 
                "Administration", 
                "Team Leadership"
            ],
            languages: [
                { name: "Indonesian", level: "Native" },
                { name: "English", level: "Professional" },
                { name: "Mandarin", level: "Basic" }
            ],
            customSections: []
        };

        // Reactive State Wrapper
        let cvData = JSON.parse(JSON.stringify(initialState));

        // --- INIT ---
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            populateEditor();
            updatePreview();
        });

        // --- DATA HANDLERS ---
        function updateData(field, value) {
            cvData[field] = value;
            updatePreview();
        }

        function updateColor(color) {
            cvData.color = color;
            document.documentElement.style.setProperty('--primary-color', color);
        }

        function handlePhoto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    cvData.photo = e.target.result;
                    document.getElementById('thumb-photo').src = e.target.result;
                    document.getElementById('thumb-photo').classList.remove('hidden');
                    document.getElementById('icon-photo').classList.add('hidden');
                    updatePreview();
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // --- LIST MANAGEMENT (Add/Delete/Update) ---
        function addItem(type) {
            const id = Date.now();
            if (type === 'experience') {
                cvData.experience.unshift({ id, title: 'Job Title', company: 'Company', date: 'Date', desc: 'Description' });
            } else if (type === 'education') {
                cvData.education.unshift({ id, degree: 'Degree', school: 'School', date: 'Date' });
            } else if (type === 'skills') {
                cvData.skills.push("New Skill");
            } else if (type === 'languages') {
                cvData.languages.push({ name: "Language", level: "Level" });
            }
            renderEditorList(type);
            updatePreview();
        }

        function deleteItem(type, index) {
            cvData[type].splice(index, 1);
            renderEditorList(type);
            updatePreview();
        }

        function updateItem(type, index, field, value) {
            if (typeof cvData[type][index] === 'string') {
                cvData[type][index] = value;
            } else {
                cvData[type][index][field] = value;
            }
            updatePreview();
        }

        function addCustomSection() {
            const title = prompt("Nama Section Baru (contoh: Projects):");
            if(title) {
                cvData.customSections.push({
                    id: Date.now(),
                    title: title,
                    items: [{ title: "Project Name", desc: "Detail description" }]
                });
                renderCustomEditor();
                updatePreview();
            }
        }

        // --- RENDER EDITOR UI ---
        function populateEditor() {
            // Fill static inputs
            document.getElementById('input-name').value = cvData.name;
            document.getElementById('input-role').value = cvData.role;
            document.getElementById('input-summary').value = cvData.summary;
            document.getElementById('input-email').value = cvData.email;
            document.getElementById('input-phone').value = cvData.phone;
            document.getElementById('input-address').value = cvData.address;
            document.getElementById('input-linkedin').value = cvData.linkedin;
            document.getElementById('themeSelector').value = cvData.theme;

            // Render Lists
            renderEditorList('experience');
            renderEditorList('education');
            renderEditorList('skills');
            renderEditorList('languages');
            renderCustomEditor();
        }

        function renderEditorList(type) {
            const container = document.getElementById(`editor-${type}`);
            container.innerHTML = '';

            cvData[type].forEach((item, index) => {
                const el = document.createElement('div');
                el.className = "bg-gray-50 p-3 rounded border relative group";
                
                let inputs = '';
                if (type === 'experience') {
                    inputs = `
                        <input value="${item.title}" oninput="updateItem('${type}', ${index}, 'title', this.value)" class="w-full text-sm font-bold bg-transparent border-b mb-1 focus:outline-none" placeholder="Job Title">
                        <div class="grid grid-cols-2 gap-2 mb-1">
                            <input value="${item.company}" oninput="updateItem('${type}', ${index}, 'company', this.value)" class="text-xs bg-transparent border-b focus:outline-none" placeholder="Company">
                            <input value="${item.date}" oninput="updateItem('${type}', ${index}, 'date', this.value)" class="text-xs bg-transparent border-b text-gray-500 focus:outline-none" placeholder="Date">
                        </div>
                        <textarea oninput="updateItem('${type}', ${index}, 'desc', this.value)" rows="2" class="w-full text-xs p-1 border rounded">${item.desc}</textarea>
                    `;
                } else if (type === 'education') {
                    inputs = `
                        <input value="${item.degree}" oninput="updateItem('${type}', ${index}, 'degree', this.value)" class="w-full text-sm font-bold bg-transparent border-b mb-1 focus:outline-none" placeholder="Degree">
                        <div class="grid grid-cols-2 gap-2">
                            <input value="${item.school}" oninput="updateItem('${type}', ${index}, 'school', this.value)" class="text-xs bg-transparent border-b focus:outline-none" placeholder="School">
                            <input value="${item.date}" oninput="updateItem('${type}', ${index}, 'date', this.value)" class="text-xs bg-transparent border-b text-gray-500 focus:outline-none" placeholder="Date">
                        </div>
                    `;
                } else if (type === 'skills') {
                    inputs = `
                        <input value="${item}" oninput="updateItem('${type}', ${index}, null, this.value)" class="w-full text-xs bg-transparent focus:outline-none" placeholder="Skill">
                    `;
                } else if (type === 'languages') {
                    inputs = `
                        <div class="flex gap-2">
                            <input value="${item.name}" oninput="updateItem('${type}', ${index}, 'name', this.value)" class="flex-1 text-xs bg-transparent border-b focus:outline-none" placeholder="Language">
                            <input value="${item.level}" oninput="updateItem('${type}', ${index}, 'level', this.value)" class="w-20 text-xs bg-transparent border-b text-gray-500 focus:outline-none" placeholder="Level">
                        </div>
                    `;
                }

                el.innerHTML = `
                    <button onclick="deleteItem('${type}', ${index})" class="absolute top-2 right-2 text-red-400 hover:text-red-600 opacity-0 group-hover:opacity-100 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    ${inputs}
                `;
                container.appendChild(el);
            });
            lucide.createIcons();
        }

        function renderCustomEditor() {
            const container = document.getElementById('editor-custom');
            container.innerHTML = '';
            
            cvData.customSections.forEach((section, sIdx) => {
                const html = `
                    <div class="border-l-4 border-blue-200 pl-3">
                        <div class="flex justify-between items-center mb-2">
                             <input value="${section.title}" oninput="updateCustomTitle(${sIdx}, this.value)" class="font-bold text-sm bg-transparent border-b">
                             <button onclick="deleteCustomSection(${sIdx})" class="text-red-500 text-xs">Hapus</button>
                        </div>
                        <div class="space-y-2">
                             ${section.items.map((item, iIdx) => `
                                <div class="bg-gray-50 p-2 rounded text-xs">
                                     <input value="${item.title}" oninput="updateCustomItem(${sIdx}, ${iIdx}, 'title', this.value)" class="w-full font-bold bg-transparent border-b mb-1">
                                     <textarea oninput="updateCustomItem(${sIdx}, ${iIdx}, 'desc', this.value)" rows="1" class="w-full p-1 border">${item.desc}</textarea>
                                </div>
                             `).join('')}
                             <button onclick="addCustomItem(${sIdx})" class="text-xs text-blue-500">+ Item</button>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }
        
        // Custom Section Helpers
        function updateCustomTitle(sIdx, val) { cvData.customSections[sIdx].title = val; updatePreview(); }
        function deleteCustomSection(sIdx) { cvData.customSections.splice(sIdx, 1); renderCustomEditor(); updatePreview(); }
        function addCustomItem(sIdx) { cvData.customSections[sIdx].items.push({title:'Title', desc:'Desc'}); renderCustomEditor(); updatePreview(); }
        function updateCustomItem(sIdx, iIdx, field, val) { cvData.customSections[sIdx].items[iIdx][field] = val; updatePreview(); }


        // --- MAIN RENDERER (PREVIEW) ---
        function updatePreview() {
            const container = document.getElementById('cv-preview');
            const theme = document.getElementById('themeSelector').value;
            container.className = `theme-${theme}`; // Apply Theme Class

            // 1. ATS CLASSIC RENDERER
            if (theme === 'ats-classic') {
                container.innerHTML = `
                    <div class="header">
                        <h1>${cvData.name}</h1>
                        <div class="role">${cvData.role}</div>
                        <div class="contact-line">
                            ${cvData.address} | ${cvData.phone} | ${cvData.email}
                        </div>
                        <div class="contact-line">
                            ${cvData.linkedin}
                        </div>
                    </div>

                    <div class="section-title">Professional Summary</div>
                    <p style="text-align:justify;">${cvData.summary}</p>

                    <div class="section-title">Work Experience</div>
                    ${cvData.experience.map(exp => `
                        <div style="margin-bottom:10px;">
                            <div class="item-header">
                                <span>${exp.title}</span>
                                <span>${exp.date}</span>
                            </div>
                            <div class="item-sub">${exp.company}</div>
                            <ul>
                                ${exp.desc.split('\n').map(l => l ? `<li>${l}</li>` : '').join('')}
                            </ul>
                        </div>
                    `).join('')}

                    <div class="section-title">Education</div>
                    ${cvData.education.map(edu => `
                        <div style="margin-bottom:10px;">
                            <div class="item-header">
                                <span>${edu.degree}</span>
                                <span>${edu.date}</span>
                            </div>
                            <div class="item-sub">${edu.school}</div>
                        </div>
                    `).join('')}

                    <div class="section-title">Skills & Languages</div>
                    <p><strong>Core Skills:</strong> ${cvData.skills.join(', ')}</p>
                    <p><strong>Languages:</strong> ${cvData.languages.map(l => `${l.name} (${l.level})`).join(', ')}</p>

                    ${cvData.customSections.map(sec => `
                        <div class="section-title">${sec.title}</div>
                        ${sec.items.map(item => `
                            <div style="margin-bottom:5px;">
                                <strong>${item.title}</strong>: ${item.desc}
                            </div>
                        `).join('')}
                    `).join('')}
                `;
            }

            // 2. EUROPEAN (EUROPASS) RENDERER
            else if (theme === 'europe') {
                const photoHtml = cvData.photo ? `<div class="photo-box"><img src="${cvData.photo}"></div>` : '';
                
                container.innerHTML = `
                    <aside class="sidebar">
                        ${photoHtml}
                        
                        <div class="sidebar-section">
                            <div class="sidebar-title">Contact</div>
                            <div class="sidebar-item">📍 ${cvData.address}</div>
                            <div class="sidebar-item">📞 ${cvData.phone}</div>
                            <div class="sidebar-item">📧 ${cvData.email}</div>
                            <div class="sidebar-item">🔗 ${cvData.linkedin}</div>
                        </div>

                        <div class="sidebar-section">
                            <div class="sidebar-title">Skills</div>
                            ${cvData.skills.map(skill => `<div class="sidebar-item">• ${skill}</div>`).join('')}
                        </div>

                        <div class="sidebar-section">
                            <div class="sidebar-title">Languages</div>
                            ${cvData.languages.map(lang => `
                                <div class="sidebar-item" style="justify-content:space-between;">
                                    <span>${lang.name}</span>
                                    <span style="opacity:0.7">${lang.level}</span>
                                </div>
                            `).join('')}
                        </div>
                    </aside>

                    <div class="main-col">
                        <h1>${cvData.name}</h1>
                        <div class="role">${cvData.role}</div>
                        <p style="line-height:1.6; color:#444; margin-bottom:30px;">${cvData.summary}</p>

                        <div class="section-title"><i data-lucide="briefcase"></i> Work Experience</div>
                        ${cvData.experience.map(exp => `
                            <div style="margin-bottom:20px;">
                                <div class="item-header">
                                    <span class="item-title">${exp.title}</span>
                                    <span class="item-date">${exp.date}</span>
                                </div>
                                <div class="item-sub">${exp.company}</div>
                                <ul style="padding-left:18px; color:#444;">
                                    ${exp.desc.split('\n').map(l => l ? `<li>${l}</li>` : '').join('')}
                                </ul>
                            </div>
                        `).join('')}

                        <div class="section-title"><i data-lucide="graduation-cap"></i> Education</div>
                        ${cvData.education.map(edu => `
                            <div style="margin-bottom:15px;">
                                <div class="item-header">
                                    <span class="item-title">${edu.degree}</span>
                                    <span class="item-date">${edu.date}</span>
                                </div>
                                <div class="item-sub">${edu.school}</div>
                            </div>
                        `).join('')}
                        
                        ${cvData.customSections.map(sec => `
                            <div class="section-title"><i data-lucide="folder"></i> ${sec.title}</div>
                            ${sec.items.map(item => `
                                <div style="margin-bottom:10px;">
                                    <div class="item-title" style="font-size:1rem;">${item.title}</div>
                                    <p style="color:#555; margin:0;">${item.desc}</p>
                                </div>
                            `).join('')}
                        `).join('')}
                    </div>
                `;
            }

            // 3. CREATIVE RENDERER (Fallback Modern)
            else if (theme === 'creative') {
                 const photoHtml = cvData.photo ? `<div class="photo-box"><img src="${cvData.photo}"></div>` : '';
                 container.innerHTML = `
                    <div class="header-banner">
                        <div class="header-text">
                            <h1>${cvData.name}</h1>
                            <div style="color:#718096; font-size:1.2rem; margin-top:5px; text-transform:uppercase; letter-spacing:2px;">${cvData.role}</div>
                        </div>
                        ${photoHtml}
                    </div>
                    
                    <div class="body-content">
                        <div class="left-col">
                             <div class="section-title">About Me</div>
                             <p style="line-height:1.8; color:#4a5568;">${cvData.summary}</p>

                             <div class="section-title">Experience</div>
                             ${cvData.experience.map(exp => `
                                <div style="margin-bottom:25px;">
                                    <div class="item-title" style="color:var(--primary-color)">${exp.title}</div>
                                    <div style="font-size:0.9rem; font-weight:bold; color:#718096; margin-bottom:5px;">${exp.company} | ${exp.date}</div>
                                    <p style="color:#4a5568; font-size:0.95rem; line-height:1.6;">${exp.desc}</p>
                                </div>
                            `).join('')}

                             <div class="section-title">Education</div>
                             ${cvData.education.map(edu => `
                                <div style="margin-bottom:15px;">
                                    <div class="item-title">${edu.degree}</div>
                                    <div style="color:#718096;">${edu.school}, ${edu.date}</div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="right-col">
                            <div class="section-title">Contact</div>
                            <div style="font-size:0.9rem; margin-bottom:8px;">${cvData.address}</div>
                            <div style="font-size:0.9rem; margin-bottom:8px;">${cvData.phone}</div>
                            <div style="font-size:0.9rem; margin-bottom:8px;">${cvData.email}</div>
                            <div style="font-size:0.9rem; margin-bottom:8px;">${cvData.linkedin}</div>

                            <div class="section-title">Skills</div>
                            <div style="display:flex; flex-wrap:wrap; gap:8px;">
                                ${cvData.skills.map(s => `
                                    <span style="background:#e2e8f0; padding:4px 8px; border-radius:4px; font-size:0.85rem; font-weight:600; color:#2d3748;">${s}</span>
                                `).join('')}
                            </div>
                            
                            <div class="section-title">Languages</div>
                            <ul style="padding-left:15px;">
                                ${cvData.languages.map(l => `<li style="margin-bottom:5px;">${l.name} - <span style="color:#718096">${l.level}</span></li>`).join('')}
                            </ul>
                        </div>
                    </div>
                 `;
            }
            
            // Re-init icons for the newly injected HTML
            lucide.createIcons();
        }

    </script>
</body>
</html>
