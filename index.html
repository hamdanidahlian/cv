<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic CV Builder - Rahayu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Merriweather:wght@300;400;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS BAWAAN (Sama seperti sebelumnya) --- */
        body { margin: 0; padding: 0; }
        
        /* Preview Container */
        .cv-preview-container {
            width: 210mm;
            min-height: 297mm;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }

        /* Print Settings */
        @media print {
            @page { margin: 0; size: auto; }
            body { background: none; padding: 0; margin: 0; }
            .no-print { display: none !important; }
            /* Hide Editor Panel */
            #editor-panel { display: none !important; }
            /* Make Preview Full Width */
            #preview-panel { width: 100% !important; padding: 0 !important; background: white !important; height: auto !important; overflow: visible !important; }
            .cv-preview-container {
                box-shadow: none;
                margin: 0;
                width: 100%;
                height: 100%;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
            section { page-break-inside: avoid; }
        }

        /* --- THEME 1: MODERN BLUE --- */
        .theme-modern { font-family: 'Inter', sans-serif; display: flex; flex-direction: row; color: #374151; }
        .theme-modern .sidebar { width: 34%; background-color: #0E2954; color: white; padding: 30px 20px; display: flex; flex-direction: column; }
        .theme-modern .main-content { width: 66%; padding: 40px; background-color: white; }
        .theme-modern .header-section { display: none; }
        .theme-modern .sidebar-header { display: block; text-align: center; margin-bottom: 30px; }
        .theme-modern h2 { color: #0E2954; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; border-bottom: 2px solid #e5e7eb; padding-bottom: 5px; margin-bottom: 15px; margin-top: 25px; font-size: 1.1rem; }
        .theme-modern .sidebar h3 { color: #BFDBFE; text-transform: uppercase; font-size: 0.85rem; border-bottom: 1px solid #3B82F6; padding-bottom: 5px; margin-bottom: 10px; margin-top: 25px; font-weight: 600; }
        .theme-modern .job-item { margin-bottom: 20px; padding-left: 15px; border-left: 3px solid #0E2954; }
        .theme-modern .skill-title { color: #93C5FD; font-weight: bold; font-size: 0.8rem; }
        .theme-modern .skill-desc { color: #E5E7EB; font-weight: 300; }

        /* --- THEME 2: EXECUTIVE --- */
        .theme-executive { font-family: 'Roboto', sans-serif; display: flex; flex-direction: column; color: #1f2937; }
        .theme-executive .sidebar-header { display: none; }
        .theme-executive .header-section { display: flex; justify-content: space-between; align-items: center; padding: 30px 40px; background-color: white; border-bottom: 4px solid #0E2954; }
        .theme-executive .content-wrapper { display: flex; flex-direction: row-reverse; flex-grow: 1; }
        .theme-executive .sidebar { width: 30%; background-color: #F3F4F6; color: #111827; padding: 30px 20px; border-left: 1px solid #e5e7eb; }
        .theme-executive .main-content { width: 70%; padding: 30px 40px; }
        .theme-executive h1 { color: #0E2954; font-size: 2.2rem; text-transform: uppercase; }
        .theme-executive .sidebar h3 { color: #0E2954; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; margin-top: 25px; font-size: 0.9rem; }
        .theme-executive .sidebar p, .theme-executive .sidebar span, .theme-executive .sidebar li { color: #374151; }
        .theme-executive .initial-circle { display: none; }
        .theme-executive h2 { font-size: 1.25rem; color: #0E2954; font-weight: 700; margin-top: 20px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .theme-executive h2::before { content: ''; display: block; width: 6px; height: 24px; background-color: #0E2954; }
        .theme-executive .contact-icon { color: #0E2954 !important; }
        .theme-executive .contact-text { color: #374151 !important; }
        .theme-executive .skill-title { color: #1F2937; font-weight: bold; font-size: 0.8rem; }
        .theme-executive .skill-desc { color: #4B5563; }

        /* --- THEME 3: ATS --- */
        .theme-ats { font-family: 'Merriweather', serif; display: block; padding: 40px; color: black; }
        .theme-ats .content-wrapper { display: flex; flex-direction: column; }
        .theme-ats .sidebar { width: 100%; background: none; color: black; padding: 0; order: 2; border-top: 1px solid #000; margin-top: 20px; padding-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .theme-ats .sidebar-header { display: none; }
        .theme-ats .header-section { display: block; text-align: center; margin-bottom: 20px; border-bottom: 1px solid black; padding-bottom: 20px; }
        .theme-ats .initial-circle { display: none; }
        .theme-ats .main-content { width: 100%; padding: 0; background: none; order: 1; }
        .theme-ats h1 { font-size: 2rem; text-transform: uppercase; margin-bottom: 5px; }
        .theme-ats .header-contact { font-size: 0.9rem; margin-top: 5px; }
        .theme-ats h2 { font-weight: 700; text-transform: uppercase; border-bottom: 1px solid #000; margin-top: 20px; margin-bottom: 10px; padding-bottom: 3px; }
        .theme-ats h3 { font-weight: 700; text-transform: uppercase; margin-top: 20px; font-size: 1rem; color: black !important; border: none !important; }
        .theme-ats .job-item { border: none; padding: 0; margin-bottom: 15px; }
        .theme-ats .contact-info-block { display: none; }
        .theme-ats .text-blue-200, .theme-ats .text-blue-300 { color: black !important; }
        .theme-ats li { list-style-type: square; margin-left: 20px; }
        .skill-tag { font-size: 0.75rem; line-height: 1.4; margin-bottom: 0.5rem; display: block; }

        /* UI Helpers */
        .tab-btn.active { border-bottom-color: #2563EB; color: #2563EB; background-color: #EFF6FF; }
        .theme-btn.active { ring: 2px solid blue; }
    </style>
</head>
<body class="flex flex-col lg:flex-row min-h-screen bg-gray-100 font-sans text-gray-800">

    <!-- === LEFT PANEL: EDITOR (Dinamis Form) === -->
    <div id="editor-panel" class="w-full lg:w-1/3 bg-white border-r border-gray-300 flex flex-col h-screen sticky top-0 shadow-2xl z-10">
        
        <!-- Header Editor -->
        <div class="p-4 bg-slate-900 text-white flex justify-between items-center shadow-md">
            <h1 class="font-bold text-lg flex items-center gap-2">
                <i data-lucide="layout"></i> CV Builder HTML
            </h1>
            <div class="flex gap-2">
                <button onclick="resetData()" title="Reset Default" class="p-2 hover:bg-slate-700 rounded transition"><i data-lucide="rotate-ccw" width="16"></i></button>
                <button onclick="exportJSON()" title="Simpan JSON" class="p-2 hover:bg-slate-700 rounded transition"><i data-lucide="save" width="16"></i></button>
                <button onclick="document.getElementById('file-upload').click()" title="Load JSON" class="p-2 hover:bg-slate-700 rounded transition"><i data-lucide="upload" width="16"></i></button>
                <input type="file" id="file-upload" class="hidden" accept=".json" onchange="importJSON(this)">
            </div>
        </div>

        <!-- Theme Selector -->
        <div class="p-4 bg-slate-100 border-b border-gray-200">
            <label class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2 block">Pilih Tema</label>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="changeTheme('modern')" id="btn-theme-modern" class="px-3 py-2 text-xs font-bold rounded border bg-[#0E2954] text-white border-[#0E2954]">Modern</button>
                <button onclick="changeTheme('executive')" id="btn-theme-executive" class="px-3 py-2 text-xs font-bold rounded border bg-white border-gray-300 hover:bg-gray-50">Executive</button>
                <button onclick="changeTheme('ats')" id="btn-theme-ats" class="px-3 py-2 text-xs font-bold rounded border bg-white border-gray-300 hover:bg-gray-50">ATS</button>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex bg-white border-b border-gray-200 overflow-x-auto">
            <button onclick="switchTab('personal')" id="tab-personal" class="tab-btn active px-4 py-3 text-xs font-bold uppercase tracking-wider border-b-2 flex-shrink-0 transition-colors border-blue-600 text-blue-600 bg-blue-50">Personal</button>
            <button onclick="switchTab('experience')" id="tab-experience" class="tab-btn px-4 py-3 text-xs font-bold uppercase tracking-wider border-b-2 border-transparent text-gray-500 hover:bg-gray-50">Experience</button>
            <button onclick="switchTab('education')" id="tab-education" class="tab-btn px-4 py-3 text-xs font-bold uppercase tracking-wider border-b-2 border-transparent text-gray-500 hover:bg-gray-50">Education</button>
            <button onclick="switchTab('skills')" id="tab-skills" class="tab-btn px-4 py-3 text-xs font-bold uppercase tracking-wider border-b-2 border-transparent text-gray-500 hover:bg-gray-50">Skills</button>
        </div>

        <!-- Form Content Area -->
        <div id="form-container" class="flex-1 overflow-y-auto p-5 bg-gray-50">
            <!-- Form will be injected here by JS -->
        </div>

        <!-- Footer Actions -->
        <div class="p-4 bg-white border-t border-gray-200">
            <button onclick="window.print()" class="w-full py-3 bg-[#0E2954] text-white font-bold rounded-lg shadow-lg hover:bg-blue-900 transition flex justify-center items-center gap-2">
                <i data-lucide="printer"></i> Print / Save PDF
            </button>
        </div>
    </div>

    <!-- === RIGHT PANEL: PREVIEW === -->
    <div id="preview-panel" class="w-full lg:w-2/3 bg-gray-500 overflow-auto p-4 lg:p-10 flex justify-center items-start">
        <div id="cv-document" class="cv-preview-container theme-modern">
            <!-- Content CV will be injected here by JS -->
        </div>
    </div>

    <!-- === JAVASCRIPT LOGIC === -->
    <script>
        // --- DATA AWAL ---
        const INITIAL_DATA = {
            personalInfo: {
                firstName: "Rahayu",
                lastName: "",
                role: "MBA (International) Candidate",
                phone: "+886 960-971-042",
                email: "rahayuazhr18@gmail.com",
                location: "Douliu, Yunlin, Taiwan",
                linkedin: "linkedin.com/in/rahayu-8361173a9",
                linkedinUrl: "https://linkedin.com/in/rahayu-8361173a9"
            },
            summary: "MBA (International) candidate with strengths in sales, marketing support, administration, and business operations. Experienced in customer communication, social media management, advertising content design, and team-based work in structured environments. Fast learner with strong work discipline and practical problem-solving skills.",
            strengths: "Disciplined, Punctual, Organized, Honest, Fast Learner, Problem Solving.",
            skills: [
                { title: "Sales & Customer Support", desc: "Customer handling, inquiries, relationship building." },
                { title: "Marketing Support", desc: "Social media management, ads design, audience engagement." },
                { title: "Admin & Ops", desc: "Documentation, data entry, SOP workflows, teamwork." },
                { title: "Content Production", desc: "Short video editing, basic photo editing." }
            ],
            tools: [
                "Microsoft Office (Excel, Word, PPT)",
                "Design: Canva, CapCut, Meitu",
                "Statistics: Stata"
            ],
            languages: [
                { name: "Indonesian", level: "Native" },
                { name: "English", level: "Professional" },
                { name: "Mandarin", level: "Basic" }
            ],
            experience: [
                {
                    role: "Operations / Production Support",
                    company: "Part-time",
                    location: "Taiwan",
                    year: "2023 – 2024",
                    details: [
                        "Followed SOP-based processes to support production flow and quality standards.",
                        "Coordinated with team members to ensure smooth daily operations.",
                        "Maintained clean and organized workstation aligned with safety practices.",
                        "Demonstrated punctuality, discipline, and reliability."
                    ]
                },
                {
                    role: "Digital Marketing & Live Streaming Support",
                    company: "Part-Time",
                    location: "Taiwan",
                    year: "2023 – 2024",
                    details: [
                        "Supported live streaming sessions and assisted real-time customer interaction.",
                        "Responded to customer questions to support sales conversion.",
                        "Prepared simple promotional content and edited short videos."
                    ]
                },
                {
                    role: "Admin & Customer Service",
                    company: "Web Dragon (Startup)",
                    location: "Indonesia",
                    year: "2021 – 2022",
                    details: [
                        "Handled customer inquiries and provided administrative support.",
                        "Managed documentation, basic reporting, and task coordination.",
                        "Supported customer communication by tracking issues and ensuring resolution."
                    ]
                },
                {
                    role: "Social Media & Ad Designer",
                    company: "ReadyGo (Online Ride-Hailing)",
                    location: "Indonesia",
                    year: "2020 – 2021",
                    details: [
                        "Designed advertising visuals for social media and promotional campaigns.",
                        "Managed social media posting and basic content scheduling.",
                        "Edited promotional videos for marketing content and user engagement."
                    ]
                }
            ],
            education: [
                {
                    degree: "Master of Business Administration (International)",
                    institution: "National Yunlin University of Science and Technology, Taiwan",
                    year: "2023 – 2026 (Expected)"
                },
                {
                    degree: "Bachelor of Intl. Business Administration",
                    institution: "Politeknik Negeri Bengkalis, Indonesia",
                    year: "2018 – 2022"
                }
            ]
        };

        // Global State
        let data = JSON.parse(localStorage.getItem('cv_data')) || JSON.parse(JSON.stringify(INITIAL_DATA));
        let currentTab = 'personal';
        let currentTheme = 'modern';

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            renderPreview();
            renderForm();
            lucide.createIcons();
        });

        // --- CORE FUNCTIONS ---

        function saveData() {
            localStorage.setItem('cv_data', JSON.stringify(data));
            renderPreview(); // Update preview on data change
        }

        function switchTab(tabName) {
            currentTab = tabName;
            // Update Tab UI
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active', 'border-blue-600', 'text-blue-600', 'bg-blue-50');
                btn.classList.add('border-transparent', 'text-gray-500');
            });
            const activeBtn = document.getElementById(`tab-${tabName}`);
            activeBtn.classList.add('active', 'border-blue-600', 'text-blue-600', 'bg-blue-50');
            activeBtn.classList.remove('border-transparent', 'text-gray-500');
            
            renderForm();
        }

        function changeTheme(themeName) {
            currentTheme = themeName;
            const doc = document.getElementById('cv-document');
            doc.className = `cv-preview-container theme-${themeName}`;
            
            // Update Buttons UI
            ['modern', 'executive', 'ats'].forEach(t => {
                const btn = document.getElementById(`btn-theme-${t}`);
                if (t === themeName) {
                    if(t === 'modern') btn.className = "px-3 py-2 text-xs font-bold rounded border bg-[#0E2954] text-white border-[#0E2954]";
                    else if(t === 'ats') btn.className = "px-3 py-2 text-xs font-bold rounded border bg-black text-white border-black";
                    else btn.className = "px-3 py-2 text-xs font-bold rounded border bg-gray-700 text-white border-gray-700";
                } else {
                    btn.className = "px-3 py-2 text-xs font-bold rounded border bg-white border-gray-300 hover:bg-gray-50";
                }
            });
        }

        function resetData() {
            if(confirm("Reset data ke default? Perubahan akan hilang.")) {
                data = JSON.parse(JSON.stringify(INITIAL_DATA));
                saveData();
                renderForm();
            }
        }

        function exportJSON() {
            const jsonString = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data));
            const link = document.createElement("a");
            link.href = jsonString;
            link.download = "cv-rahayu-data.json";
            link.click();
        }

        function importJSON(input) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    data = JSON.parse(e.target.result);
                    saveData();
                    renderForm();
                } catch(err) {
                    alert("File JSON tidak valid!");
                }
            };
            reader.readAsText(file);
        }

        // --- FORM RENDERING (EDITOR) ---
        function renderForm() {
            const container = document.getElementById('form-container');
            container.innerHTML = ''; // Clear existing

            if (currentTab === 'personal') {
                container.innerHTML = `
                    <div class="space-y-4">
                        ${createInput('First Name', 'firstName', data.personalInfo.firstName, 'updatePersonal')}
                        ${createInput('Last Name', 'lastName', data.personalInfo.lastName, 'updatePersonal')}
                        ${createInput('Role Title', 'role', data.personalInfo.role, 'updatePersonal')}
                        ${createTextArea('Professional Summary', data.summary, 'updateSummary', 5)}
                        ${createTextArea('Strengths (ATS)', data.strengths, 'updateStrengths', 2)}
                        
                        <h3 class="font-bold text-sm text-gray-700 pt-4 border-t">Contact Info</h3>
                        ${createInput('Phone', 'phone', data.personalInfo.phone, 'updatePersonal')}
                        ${createInput('Email', 'email', data.personalInfo.email, 'updatePersonal')}
                        ${createInput('Location', 'location', data.personalInfo.location, 'updatePersonal')}
                        ${createInput('LinkedIn Text', 'linkedin', data.personalInfo.linkedin, 'updatePersonal')}
                        ${createInput('LinkedIn URL', 'linkedinUrl', data.personalInfo.linkedinUrl, 'updatePersonal')}
                    </div>
                `;
            } else if (currentTab === 'experience') {
                let html = `<button onclick="addExperience()" class="w-full py-2 bg-blue-600 text-white rounded font-bold text-sm flex items-center justify-center gap-2 hover:bg-blue-700 transition mb-4"><i data-lucide="plus" width="16"></i> Add Job</button>`;
                
                data.experience.forEach((exp, idx) => {
                    html += `
                        <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm relative group mb-4">
                            <button onclick="removeExperience(${idx})" class="absolute top-2 right-2 text-gray-400 hover:text-red-500"><i data-lucide="trash-2" width="16"></i></button>
                            <div class="space-y-2 mb-3">
                                ${createInput('Job Title', '', exp.role, `updateExpField(${idx}, 'role', this.value)`)}
                                ${createInput('Company', '', exp.company, `updateExpField(${idx}, 'company', this.value)`)}
                                <div class="grid grid-cols-2 gap-2">
                                    ${createInput('Year', '', exp.year, `updateExpField(${idx}, 'year', this.value)`)}
                                    ${createInput('Location', '', exp.location, `updateExpField(${idx}, 'location', this.value)`)}
                                </div>
                            </div>
                            <label class="text-xs font-bold text-gray-500 mb-1 block">Bullet Points</label>
                            <div class="space-y-2">
                                ${exp.details.map((det, dIdx) => `
                                    <div class="flex gap-2 items-start">
                                        <textarea class="w-full text-xs p-2 border border-gray-300 rounded bg-gray-50" rows="2" oninput="updateExpDetail(${idx}, ${dIdx}, this.value)">${det}</textarea>
                                        <button onclick="removeExpDetail(${idx}, ${dIdx})" class="text-red-400 hover:text-red-600 mt-1"><i data-lucide="trash-2" width="14"></i></button>
                                    </div>
                                `).join('')}
                                <button onclick="addExpDetail(${idx})" class="text-xs text-blue-600 hover:underline font-medium">+ Add Point</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } else if (currentTab === 'education') {
                let html = `<button onclick="addEducation()" class="w-full py-2 bg-blue-600 text-white rounded font-bold text-sm flex items-center justify-center gap-2 hover:bg-blue-700 transition mb-4"><i data-lucide="plus" width="16"></i> Add Education</button>`;
                
                data.education.forEach((edu, idx) => {
                    html += `
                        <div class="bg-white p-4 rounded-lg border border-gray-200 shadow-sm relative mb-4">
                             <button onclick="removeEducation(${idx})" class="absolute top-2 right-2 text-gray-400 hover:text-red-500"><i data-lucide="trash-2" width="16"></i></button>
                             <div class="space-y-3">
                                ${createInput('Degree', '', edu.degree, `updateEduField(${idx}, 'degree', this.value)`)}
                                ${createInput('University', '', edu.institution, `updateEduField(${idx}, 'institution', this.value)`)}
                                ${createInput('Year', '', edu.year, `updateEduField(${idx}, 'year', this.value)`)}
                             </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } else if (currentTab === 'skills') {
                let html = `
                    <div class="space-y-6">
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <h3 class="font-bold text-sm text-gray-700">Core Skills</h3>
                                <button onclick="addSkill()" class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded hover:bg-blue-200 font-bold">+ Add</button>
                            </div>
                            <div class="space-y-3">
                                ${data.skills.map((skill, idx) => `
                                    <div class="bg-white p-3 rounded border border-gray-200 relative">
                                        <button onclick="removeSkill(${idx})" class="absolute top-2 right-2 text-gray-300 hover:text-red-500"><i data-lucide="trash-2" width="14"></i></button>
                                        ${createInput('Category', '', skill.title, `updateSkillField(${idx}, 'title', this.value)`)}
                                        <div class="mt-2">
                                            <label class="text-[10px] text-gray-400 font-bold uppercase block mb-1">Description</label>
                                            <textarea class="w-full text-xs p-2 border border-gray-300 rounded bg-gray-50" rows="2" oninput="updateSkillField(${idx}, 'desc', this.value)">${skill.desc}</textarea>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div>
                            <h3 class="font-bold text-sm text-gray-700 mb-2">Tools</h3>
                            <textarea class="w-full text-xs p-3 border border-gray-300 rounded bg-white min-h-[100px]" oninput="updateTools(this.value)">${data.tools.join('\n')}</textarea>
                            <p class="text-[10px] text-gray-500 mt-1">Pisahkan dengan baris baru (Enter).</p>
                        </div>

                        <div>
                            <h3 class="font-bold text-sm text-gray-700 mb-2">Languages</h3>
                            <div class="space-y-2">
                                ${data.languages.map((lang, idx) => `
                                    <div class="flex gap-2">
                                        <input class="w-1/2 text-xs p-2 border border-gray-300 rounded" value="${lang.name}" oninput="updateLang(${idx}, 'name', this.value)">
                                        <input class="w-1/2 text-xs p-2 border border-gray-300 rounded" value="${lang.level}" oninput="updateLang(${idx}, 'level', this.value)">
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML = html;
            }
            lucide.createIcons();
        }

        // --- UPDATE HANDLERS ---
        // Personal
        window.updatePersonal = (el) => {
            data.personalInfo[el.name] = el.value;
            saveData();
        };
        window.updateSummary = (val) => { data.summary = val; saveData(); };
        window.updateStrengths = (val) => { data.strengths = val; saveData(); };
        
        // Experience
        window.addExperience = () => {
            data.experience.unshift({ role: "New Role", company: "Company", location: "Loc", year: "2024", details: ["Detail"] });
            saveData(); renderForm();
        };
        window.removeExperience = (idx) => {
            data.experience.splice(idx, 1);
            saveData(); renderForm();
        };
        window.updateExpField = (idx, field, val) => {
            data.experience[idx][field] = val;
            saveData();
        };
        window.updateExpDetail = (idx, dIdx, val) => {
            data.experience[idx].details[dIdx] = val;
            saveData();
        };
        window.addExpDetail = (idx) => {
            data.experience[idx].details.push("New Point");
            saveData(); renderForm();
        };
        window.removeExpDetail = (idx, dIdx) => {
            data.experience[idx].details.splice(dIdx, 1);
            saveData(); renderForm();
        };

        // Education
        window.addEducation = () => {
            data.education.unshift({ degree: "Degree", institution: "Univ", year: "2024" });
            saveData(); renderForm();
        };
        window.removeEducation = (idx) => {
            data.education.splice(idx, 1);
            saveData(); renderForm();
        };
        window.updateEduField = (idx, field, val) => {
            data.education[idx][field] = val;
            saveData();
        };

        // Skills
        window.addSkill = () => {
            data.skills.push({ title: "Skill", desc: "Desc" });
            saveData(); renderForm();
        };
        window.removeSkill = (idx) => {
            data.skills.splice(idx, 1);
            saveData(); renderForm();
        };
        window.updateSkillField = (idx, field, val) => {
            data.skills[idx][field] = val;
            saveData();
        };
        window.updateTools = (val) => {
            data.tools = val.split('\n');
            saveData();
        };
        window.updateLang = (idx, field, val) => {
            data.languages[idx][field] = val;
            saveData();
        };

        // --- PREVIEW RENDERING ---
        function renderPreview() {
            const doc = document.getElementById('cv-document');
            const p = data.personalInfo;
            
            // Generate Sidebar HTML
            const sidebarHTML = `
                <aside class="sidebar">
                    <div class="sidebar-header">
                        <div class="initial-circle w-20 h-20 bg-blue-400 rounded-full mx-auto flex items-center justify-center text-3xl font-bold text-[#0E2954] mb-4 border-4 border-white">
                            ${p.firstName.charAt(0)}
                        </div>
                        <h1 class="text-2xl font-bold tracking-wider uppercase">${p.firstName} ${p.lastName}</h1>
                        <p class="text-blue-200 text-sm mt-1">${p.role}</p>
                    </div>

                    <div class="contact-info-block mb-6">
                        <h3 class="tracking-widest text-blue-100">Contact</h3>
                        <ul class="space-y-2 text-xs font-light">
                            <li class="flex items-start gap-3"><span class="contact-icon">📍</span><span class="contact-text">${p.location}</span></li>
                            <li class="flex items-start gap-3"><span class="contact-icon">📞</span><span class="contact-text">${p.phone}</span></li>
                            <li class="flex items-start gap-3"><span class="contact-icon">📧</span><span class="break-all contact-text">${p.email}</span></li>
                            <li class="flex items-start gap-3"><span class="contact-icon">🔗</span><a href="${p.linkedinUrl}" class="hover:underline contact-text">LinkedIn</a></li>
                        </ul>
                    </div>

                    <div class="mb-6">
                        <h3 class="tracking-widest text-blue-100">Core Skills</h3>
                        ${data.skills.map(s => `
                            <div class="skill-tag">
                                <span class="skill-title contact-text">${s.title}</span>
                                <span class="skill-desc contact-text block">${s.desc}</span>
                            </div>
                        `).join('')}
                    </div>

                    <div class="mb-6">
                        <h3 class="tracking-widest text-blue-100">Tools</h3>
                        <ul class="text-xs space-y-1 contact-text">
                            ${data.tools.map(t => `<li>• ${t}</li>`).join('')}
                        </ul>
                    </div>

                    <div class="mb-6">
                        <h3 class="tracking-widest text-blue-100">Languages</h3>
                        <ul class="space-y-1 text-xs contact-text">
                            ${data.languages.map(l => `<li class="flex justify-between"><span>${l.name}</span><span class="text-blue-300 contact-icon">${l.level}</span></li>`).join('')}
                        </ul>
                    </div>

                    <div class="mt-auto pt-4 border-t border-blue-800 theme-executive:border-gray-300">
                        <p class="text-xs font-bold text-black-400 theme-executive:text-green-700 contact-text">Available for immediate start</p>
                    </div>
                </aside>
            `;

            // Generate Main Content HTML
            const mainHTML = `
                <main class="main-content">
                    <section class="mb-6">
                        <h2>Professional Summary</h2>
                        <p class="text-sm leading-relaxed text-justify">${data.summary}</p>
                    </section>

                    <section class="mb-6">
                        <h2>Work Experience</h2>
                        ${data.experience.map((job, i) => `
                            <div class="job-item ${i === data.experience.length -1 ? 'border-l-0' : ''}">
                                <div class="flex justify-between items-baseline mb-1 flex-wrap">
                                    <h3 class="font-bold text-md m-0 p-0 border-none text-gray-800">${job.role}</h3>
                                    <span class="text-xs font-bold bg-gray-100 px-2 py-1 rounded border border-gray-300">${job.year}</span>
                                </div>
                                <p class="text-sm italic mb-2 font-semibold text-gray-600">${job.company} | ${job.location}</p>
                                <ul class="list-disc list-inside text-sm space-y-1 ml-1 text-gray-700">
                                    ${job.details.map(d => `<li>${d}</li>`).join('')}
                                </ul>
                            </div>
                        `).join('')}
                    </section>

                    <section>
                        <h2>Education</h2>
                        ${data.education.map((edu, i) => `
                            <div class="${i === 0 ? 'mb-4' : 'pt-2 border-t border-dashed border-gray-300'}">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h3 class="font-bold text-sm m-0 p-0 border-none">${edu.degree}</h3>
                                        <p class="text-xs text-gray-700">${edu.institution}</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="${i === 0 ? 'text-xs font-bold bg-blue-50 px-2 py-1 rounded inline-block' : 'text-xs text-gray-600 font-bold'}">${edu.year}</p>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </section>
                    
                    <section class="mt-4 pt-4 border-t border-black hidden theme-ats:block">
                        <h2>Professional Strengths</h2>
                        <p class="text-sm">${data.strengths}</p>
                    </section>
                </main>
            `;

            // Top Header (For Executive/ATS)
            const topHeaderHTML = `
                <header class="header-section">
                    <div class="flex-1">
                        <h1 class="font-bold text-3xl mb-1">${p.firstName} ${p.lastName}</h1>
                        <p class="text-lg header-role text-gray-600 uppercase tracking-wide">${p.role}</p>
                        <div class="header-contact mt-2 text-sm hidden theme-ats:block">
                            ${p.location} | ${p.phone} | ${p.email} <br> ${p.linkedin}
                        </div>
                    </div>
                    <div class="text-right text-sm leading-relaxed hidden theme-executive:block">
                        <p>${p.location}</p>
                        <p>${p.phone}</p>
                        <p>${p.email}</p>
                    </div>
                </header>
            `;

            doc.innerHTML = topHeaderHTML + `<div class="content-wrapper h-full flex w-full">${sidebarHTML}${mainHTML}</div>`;
        }

        // Helpers
        function createInput(label, name, value, onChangeStr) {
            return `
                <div>
                    <label class="text-[10px] text-gray-400 font-bold uppercase block mb-1">${label}</label>
                    <input type="text" name="${name}" class="w-full text-xs p-2.5 border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 outline-none" value="${value}" oninput="${name ? `updatePersonal(this)` : onChangeStr}">
                </div>
            `;
        }
        function createTextArea(label, value, onChangeFunc, rows) {
            return `
                <div>
                    <label class="text-[10px] text-gray-400 font-bold uppercase block mb-1">${label}</label>
                    <textarea class="w-full text-xs p-2.5 border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 outline-none resize-none" rows="${rows}" oninput="${onChangeFunc}(this.value)">${value}</textarea>
                </div>
            `;
        }
    </script>
</body>
</html>
